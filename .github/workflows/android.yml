name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
      - name: Name the APK and bundle
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "reply-translator-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "reply-translator-${GITHUB_SHA::7}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: reply-translator-apk
          path: reply-translator-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reply-translator-aab
          path: reply-translator-*.aab
